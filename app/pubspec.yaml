name: app
description: "Interval — a modern, Anki-compatible spaced repetition app."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.13.2
resolution: workspace

dependencies:
  anki_format:
    path: ../packages/anki_format
  audioplayers: ^6.8.1
  card_template:
    path: ../packages/card_template
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  fsrs:
    path: ../packages/fsrs
  go_router: ^18.0.1
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  riverpod_annotation: ^4.0.7
  sqlite3: ^3.5.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1

dev_dependencies:
  archive: ^4.2.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
