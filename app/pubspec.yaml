name: app
description: "Interval — a modern, Anki-compatible spaced repetition app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2
resolution: workspace

dependencies:
  anki_format:
    path: ../packages/anki_format
  card_template:
    path: ../packages/card_template
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  fsrs:
    path: ../packages/fsrs
  go_router: ^18.0.1
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  webview_flutter: ^4.14.1

dev_dependencies:
  archive: ^4.2.0
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^4.0.9
  sqlite3: ^3.5.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
